<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>happy birthday, Jessica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #f7f5fb;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            font-weight: 300;
            color: #3a3a4a;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
            filter: blur(3px);
            animation: drift 20s infinite ease-in-out;
        }

        @keyframes drift {
            0%   { transform: translateY(0) rotate(0deg); }
            50%  { transform: translateY(-25px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .birthday-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 3.5rem 4.5rem;
            text-align: center;
            box-shadow: 0 15px 35px rgba(167, 139, 250, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: 0.3s;
            max-width: 90vw;
            z-index: 10;
        }

        .birthday-card:hover {
            box-shadow: 0 20px 40px rgba(167, 139, 250, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.9);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #6b5b8c;
            margin-bottom: 0.8rem;
            line-height: 1.3;
        }

        .name-highlight {
            font-size: 4.5rem;
            display: block;
            font-weight: 500;
            color: #5b4a7a;
            margin: 0.3rem 0 0.8rem;
            letter-spacing: 1px;
            animation: gentleFloat 6s infinite ease-in-out;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }

        .sub {
            font-size: 1.1rem;
            color: #8a86a0;
            margin-top: 1.5rem;
            font-style: italic;
            letter-spacing: 0.3px;
        }

        .enter-link {
            display: inline-block;
            margin-top: 2.2rem;
            font-size: 1.15rem;
            color: #7c6fa0;
            text-decoration: none;
            letter-spacing: 1px;
            border-bottom: 1px solid #c9bde0;
            padding-bottom: 3px;
            transition: 0.2s ease;
            font-weight: 400;
        }

        .enter-link:hover {
            color: #5b4a7a;
            border-bottom-color: #5b4a7a;
            letter-spacing: 1.2px;
        }

        .enter-link .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
            margin-left: 4px;
        }

        .enter-link:hover .arrow { transform: translateX(4px); }

        .cake-icon {
            font-size: 3.2rem;
            margin-bottom: 1.2rem;
            display: inline-block;
            opacity: 0.9;
        }

        @media (max-width: 700px) {
            .birthday-card { padding: 2.5rem 2rem; border-radius: 28px; }
            h1 { font-size: 2.2rem; letter-spacing: 1px; }
            .name-highlight { font-size: 3.4rem; }
            .sub { font-size: 1rem; }
            .enter-link { font-size: 1rem; }
            .cake-icon { font-size: 2.8rem; }
        }

        @media (max-width: 400px) {
            .birthday-card { padding: 2rem 1.5rem; }
            h1 { font-size: 1.8rem; }
            .name-highlight { font-size: 2.8rem; }
        }
    </style>
</head>
<body>
    <div class="shape" style="width: 180px; height: 180px; background: #d4c8e8; top: 5%; left: 2%; animation-duration: 22s;"></div>
    <div class="shape" style="width: 140px; height: 140px; background: #c2d6f0; bottom: 10%; right: 5%; animation-duration: 19s; animation-delay: 2s;"></div>
    <div class="shape" style="width: 220px; height: 220px; background: #e9e2f5; top: 60%; left: 75%; animation-duration: 24s; animation-delay: 1s;"></div>
    <div class="shape" style="width: 100px; height: 100px; background: #cfe0f0; top: 15%; right: 12%; animation-duration: 16s;"></div>
    <div class="shape" style="width: 160px; height: 160px; background: #ddd2f0; bottom: 15%; left: 12%; animation-duration: 21s; animation-delay: 3s;"></div>

    <div class="birthday-card">
        <div class="cake-icon">🎂</div>
        <h1>
            happy birthday
            <span class="name-highlight">Jessica</span>
        </h1>
        <p class="sub">26/10/2026</p>

        <a href="surprise.html" class="enter-link">
            click here <span class="arrow">→</span>
        </a>
    </div>
</body>
</html>
